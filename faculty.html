<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faculty Directory — Faculty Management System</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/x-icon" href="./assets/logo.ico" />
  </head>
  <body>
    <div class="app-shell">
      <!-- Sidebar Loader -->
      <div id="sidebarContainer"></div>
      <script>
        fetch("sidebar.html")
          .then((response) => response.text())
          .then((html) => {
            document.getElementById("sidebarContainer").innerHTML = html;
            setupHamburger();
            loadUser();
            setActiveNav();
          });
      </script>

      <!-- Main -->
      <div class="main-content">
        <div class="topbar">
          <div style="display: flex; align-items: center; gap: 14px">
            <button class="hamburger" id="hamburger">&#9776;</button>
            <h1>Faculty Directory</h1>
          </div>
          <div class="topbar-actions">
            <span
              id="totalBadge"
              style="font-size: 13px; color: var(--muted)"
            ></span>
            <button
              class="btn btn-primary"
              id="addBtn"
              onclick="openAddModal()"
              style="display: none"
            >
              + Add Faculty
            </button>
            <div id="profileDropdownContainer"></div>
          </div>
        </div>

        <div class="page-body">
          <div id="alertBox" class="alert" style="display: none"></div>

          <div class="search-bar">
            <input
              class="search-input"
              type="search"
              id="searchInput"
              placeholder="Search by name, department, subject..."
            />
            <button class="btn btn-outline" onclick="loadFaculty()">
              Search
            </button>
          </div>

          <div class="card" style="padding: 0">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Subject</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="facultyBody">
                  <tr>
                    <td colspan="7"><div class="spinner"></div></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Faculty Modal -->
    <div class="modal-overlay hidden" id="addModal">
      <div class="modal">
        <div class="modal-header">
          <h3>Add New Faculty</h3>
          <button class="modal-close" onclick="closeAddModal()">&times;</button>
        </div>
        <div class="modal-body">
          <div
            id="modalAlert"
            class="alert alert-error"
            style="display: none"
          ></div>
          <div class="form-grid">
            <div class="form-group">
              <label>Full Name *</label>
              <input
                class="form-control"
                id="f-name"
                placeholder="Dr. First Last"
              />
            </div>
            <div class="form-group">
              <label>Department *</label>
              <input
                class="form-control"
                id="f-dept"
                placeholder="e.g. Computer Science"
              />
            </div>
            <div class="form-group">
              <label>Designation *</label>
              <input
                class="form-control"
                id="f-desig"
                placeholder="e.g. Associate Professor"
              />
            </div>
            <div class="form-group">
              <label>Subject *</label>
              <input
                class="form-control"
                id="f-subj"
                placeholder="e.g. Algorithms"
              />
            </div>
            <div class="form-group">
              <label>Email *</label>
              <input
                class="form-control"
                id="f-email"
                type="email"
                placeholder="name@university.edu"
              />
            </div>
            <div class="form-group">
              <label>Mobile *</label>
              <input
                class="form-control"
                id="f-mobile"
                placeholder="10-digit number"
              />
            </div>
            <div class="form-group">
              <label>Office Hours *</label>
              <input
                class="form-control"
                id="f-hours"
                placeholder="Mon-Wed 10:00-12:00"
              />
            </div>
            <div class="form-group">
              <label>Qualification *</label>
              <input
                class="form-control"
                id="f-qual"
                placeholder="e.g. PhD Computer Science"
              />
            </div>
            <div class="form-group">
              <label>Experience (years) *</label>
              <input
                class="form-control"
                id="f-exp"
                type="number"
                min="0"
                max="50"
                placeholder="0"
              />
            </div>
            <div class="form-group" style="grid-column: 1/-1">
              <hr style="border-color: var(--border); margin: 4px 0" />
            </div>
            <div class="form-group">
              <label>Login Username *</label>
              <input
                class="form-control"
                id="f-user"
                placeholder="faculty login username"
              />
            </div>
            <div class="form-group">
              <label>Login Password *</label>
              <input
                class="form-control"
                id="f-pass"
                type="password"
                placeholder="Set a password"
              />
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" onclick="closeAddModal()">
            Cancel
          </button>
          <button class="btn btn-primary" id="saveBtn" onclick="saveFaculty()">
            Save Faculty
          </button>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/faculty.js"></script>
    <!-- Load profile dropdown after common.js -->
    <script>
      fetch("profile-dropdown.html")
        .then((response) => response.text())
        .then((html) => {
          document.getElementById("profileDropdownContainer").innerHTML = html;
          initProfileDropdown();
          updateProfileDropdown();
        });
    </script>
  </body>
</html>
