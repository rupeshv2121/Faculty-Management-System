<!-- Profile Dropdown Component -->
<div class="profile-menu">
  <button class="profile-btn" id="profileBtn">
    <div class="profile-avatar" id="profileAvatar">U</div>
  </button>
  <div class="profile-dropdown" id="profileDropdown">
    <div class="profile-dropdown-header">
      <div class="profile-dropdown-avatar" id="dropdownAvatar">U</div>
      <div class="profile-dropdown-info">
        <div class="profile-name" id="dropdownName">Loading...</div>
        <div class="profile-role" id="dropdownRole">User</div>
      </div>
    </div>
    <div class="profile-dropdown-divider"></div>
    <a href="profile.html" class="profile-dropdown-item">
      <svg
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
      My Profile
    </a>
    <button class="profile-dropdown-item" onclick="doLogout()">
      <svg
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      Sign Out
    </button>
  </div>
</div>
