<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile — Faculty Management System</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" type="image/x-icon" href="../assets/logo.ico" />
  </head>
  <body>
    <div class="app-shell">
      <!-- Sidebar Loader -->
      <div id="sidebarContainer"></div>
      <script>
        fetch("../components/sidebar.html")
          .then((response) => response.text())
          .then((html) => {
            document.getElementById("sidebarContainer").innerHTML = html;
            setupHamburger();
            loadUser();
            setActiveNav();
          });
      </script>

      <!-- Main -->
      <div class="main-content">
        <div class="topbar">
          <div style="display: flex; align-items: center; gap: 14px">
            <button class="hamburger" id="hamburger">&#9776;</button>
            <h1>My Profile</h1>
          </div>
          <div class="topbar-actions" id="topbarActions"></div>
        </div>

        <div class="page-body">
          <div id="alertBox" class="alert" style="display: none"></div>
          <div id="content">
            <div class="loading-container"><div class="spinner"></div></div>
          </div>
        </div>
      </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/auth.js"></script>
    <!-- Profile modules -->
    <script src="../js/profiles/common.js"></script>
    <script src="../js/profiles/faculty.js"></script>
    <!-- Main profile controller -->
    <script src="../js/profiles/profile.js"></script>
    <!-- Load profile dropdown after common.js -->
    <script>
      fetch("../components/profile-dropdown.html")
        .then((response) => response.text())
        .then((html) => {
          document.getElementById("topbarActions").innerHTML = html;
          initProfileDropdown();
          updateProfileDropdown();
        });
    </script>
  </body>
</html>
