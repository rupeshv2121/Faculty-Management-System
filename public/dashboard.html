<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — Faculty Management System</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" type="image/x-icon" href="../assets/logo.ico" />
  </head>
  <body>
    <div class="app-shell">
      <!-- Sidebar Loader -->
      <div id="sidebarContainer"></div>
      <script>
        fetch("../components/sidebar.html")
          .then((response) => response.text())
          .then((html) => {
            document.getElementById("sidebarContainer").innerHTML = html;
            setupHamburger();
            loadUser();
            setActiveNav();
          });
      </script>

      <!-- Main -->
      <div class="main-content">
        <div class="topbar">
          <div style="display: flex; align-items: center; gap: 14px">
            <button class="hamburger" id="hamburger">&#9776;</button>
            <h1 id="topbarTitle">Dashboard</h1>
          </div>
          <div class="topbar-actions">
            <button
              class="btn btn-primary"
              id="addBtn"
              onclick="openAddModal()"
              style="display: none"
            >
              + Add Faculty
            </button>
            <div id="profileDropdownContainer"></div>
          </div>
        </div>

        <div class="page-body">
          <div id="alertBox" class="alert" style="display: none"></div>
          <div id="dashboardContent">
            <div class="loading-container"><div class="spinner"></div></div>
          </div>
        </div>
      </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/auth.js"></script>
    <!-- Dashboard modules -->
    <script src="../js/dashboards/common.js"></script>
    <script src="../js/dashboards/admin-dashboard.js"></script>
    <script src="../js/dashboards/faculty-dashboard.js"></script>
    <script src="../js/dashboards/student-dashboard.js"></script>
    <!-- Main dashboard controller -->
    <script src="../js/dashboard.js"></script>
    <!-- Load profile dropdown after common.js -->
    <script>
      fetch("../components/profile-dropdown.html")
        .then((response) => response.text())
        .then((html) => {
          document.getElementById("profileDropdownContainer").innerHTML = html;
          initProfileDropdown();
        });
    </script>
  </body>
</html>
