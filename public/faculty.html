<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faculty Directory — Faculty Management System</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" type="image/x-icon" href="../assets/logo.ico" />
  </head>
  <body>
    <div class="app-shell">
      <!-- Sidebar Loader -->
      <div id="sidebarContainer"></div>
      <script>
        fetch("../components/sidebar.html")
          .then((response) => response.text())
          .then((html) => {
            document.getElementById("sidebarContainer").innerHTML = html;
            setupHamburger();
            loadUser();
            setActiveNav();
          });
      </script>

      <!-- Main -->
      <div class="main-content">
        <div class="topbar">
          <div style="display: flex; align-items: center; gap: 14px">
            <button class="hamburger" id="hamburger">&#9776;</button>
            <h1>Faculty Directory</h1>
          </div>
          <div class="topbar-actions">
            <div id="profileDropdownContainer"></div>
          </div>
        </div>

        <div class="page-body">
          <div id="alertBox" class="alert" style="display: none"></div>

          <div class="faculty-controls">
            <div class="search-bar">
              <input
                class="search-input"
                type="search"
                id="searchInput"
                placeholder="Search by name, department, subject..."
              />
              <button class="btn btn-outline" onclick="loadFaculty()">
                Search
              </button>
            </div>
            <button
              class="btn btn-primary"
              id="addBtn"
              onclick="openAddModal()"
              style=""
            >
              + Add Faculty
            </button>
          </div>
          <div class="card" style="padding: 0">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Subject</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="facultyBody">
                  <tr>
                    <td colspan="7"><div class="spinner"></div></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Faculty Modal -->
    <div class="modal-overlay hidden" id="addModal">
      <div class="modal">
        <div class="modal-header">
          <h3>Add New Faculty</h3>
          <button class="modal-close" onclick="closeAddModal()">&times;</button>
        </div>
        <div class="modal-body">
          <div
            id="modalAlert"
            class="alert alert-error"
            style="display: none"
          ></div>
          <div class="form-grid">
            <div class="form-group">
              <label>Full Name *</label>
              <input
                class="form-control"
                id="f-name"
                placeholder="Dr. First Last"
              />
              <small
                style="
                  color: var(--muted);
                  font-size: 11px;
                  margin-top: 3px;
                  display: block;
                "
                >2-50 characters, letters only</small
              >
            </div>
            <div class="form-group">
              <label>Department *</label>
              <input
                class="form-control"
                id="f-dept"
                placeholder="e.g. Computer Science"
              />
            </div>
            <div class="form-group">
              <label>Designation *</label>
              <input
                class="form-control"
                id="f-desig"
                placeholder="e.g. Associate Professor"
              />
            </div>
            <div class="form-group">
              <label>Subject *</label>
              <input
                class="form-control"
                id="f-subj"
                placeholder="e.g. Algorithms"
              />
            </div>
            <div class="form-group">
              <label>Email *</label>
              <input
                class="form-control"
                id="f-email"
                type="email"
                placeholder="name@university.edu"
              />
              <small
                style="
                  color: var(--muted);
                  font-size: 11px;
                  margin-top: 3px;
                  display: block;
                "
                >Valid email: name@domain.com</small
              >
            </div>
            <div class="form-group">
              <label>Mobile *</label>
              <input
                class="form-control"
                id="f-mobile"
                placeholder="10-digit number"
              />
              <small
                style="
                  color: var(--muted);
                  font-size: 11px;
                  margin-top: 3px;
                  display: block;
                "
                >Digits only, exact 10</small
              >
            </div>
            <div class="form-group">
              <label>Qualification *</label>
              <input
                class="form-control"
                id="f-qual"
                placeholder="e.g. PhD Computer Science"
              />
            </div>
            <div class="form-group">
              <label>Experience (years) *</label>
              <input
                class="form-control"
                id="f-exp"
                type="number"
                min="0"
                max="60"
                placeholder="0"
              />
              <small
                style="
                  color: var(--muted);
                  font-size: 11px;
                  margin-top: 3px;
                  display: block;
                "
                >0-60 years</small
              >
            </div>
            <div class="form-group" style="grid-column: 1/-1">
              <hr style="border-color: var(--border); margin: 4px 0" />
            </div>
            <div class="form-group">
              <label>Login Faculty ID or Username *</label>
              <input
                class="form-control"
                id="f-user"
                placeholder="faculty login by faculty ID or username"
              />
              <small
                style="
                  color: var(--muted);
                  font-size: 11px;
                  margin-top: 3px;
                  display: block;
                "
                >3-20 chars: letters, numbers, underscore</small
              >
            </div>
            <div class="form-group">
              <label>Login Password *</label>
              <input
                class="form-control"
                id="f-pass"
                type="password"
                placeholder="Set a password"
              />
              <small
                style="
                  color: var(--muted);
                  font-size: 11px;
                  margin-top: 3px;
                  display: block;
                "
                >Minimum 6 characters</small
              >
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" onclick="closeAddModal()">
            Cancel
          </button>
          <button class="btn btn-primary" id="saveBtn" onclick="saveFaculty()">
            Save Faculty
          </button>
        </div>
      </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/faculty.js"></script>
    <!-- Load profile dropdown after common.js -->
    <script>
      fetch("../components/profile-dropdown.html")
        .then((response) => response.text())
        .then((html) => {
          document.getElementById("profileDropdownContainer").innerHTML = html;
          initProfileDropdown();
          updateProfileDropdown();
        });
    </script>
  </body>
</html>
